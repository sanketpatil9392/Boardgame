name: Boardgame Maven CI Pipeline

# Pipeline triggers
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Pipeline jobs
jobs:

  build:
    name: Build and Test Java Application

    runs-on: ubuntu-latest

    steps:

      # Step 1: Download source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Java
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Step 3: Check Java and Maven versions
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # Step 4: Compile application
      - name: Compile Application
        run: mvn -B clean compile

      # Step 5: Run unit tests
      - name: Run Unit Tests
        run: mvn -B test

      # Step 6: Package application
      - name: Build Application JAR
        run: mvn -B package -DskipTests

      # Step 7: Check generated artifact
      - name: List Build Artifacts
        run: ls -lh target/

      # Step 8: Upload build artifact
      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boardgame-build
          path: |
            target/*.jar
            target/*.war
          if-no-files-found: error
          retention-days: 7
